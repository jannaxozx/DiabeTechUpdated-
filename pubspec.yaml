name: diabetechapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  cached_network_image: ^3.3.1

  # Facebook Auth
  flutter_facebook_auth: ^7.1.0

  # Camera
  camera: ^0.11.0
  

  # Utils
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  permission_handler: ^11.0.1
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.4


  # UI
  cupertino_icons: ^1.0.8

  # ML Kit (kept for other screens)
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_object_detection: ^0.15.0

  # Image Picker
  image_picker: ^1.0.0
  file_picker: ^8.0.0

  # HTTP - needed for Claude AI Vision API in food scanner
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/scan.png
    - assets/images/landing.png
    - assets/images/ground.png
    - assets/images/DiabeTechLogo.png
    - assets/images/Facebook1.png